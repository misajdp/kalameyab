<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14172b">
<title>کلمه‌یاب</title>
<style>
  :root{--bg:#14172b;--panel:#1f2340;--tile:#2b3057;--text:#f2f4ff;--green:#2faa5e;--yellow:#d9a62b;--gray:#4a4f73;--accent:#6c7cff;--gold:#ffc83d;--ts:50px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Tahoma,"Vazirmatn","IRANSans",sans-serif;overflow:hidden}
  #app{max-width:480px;margin:0 auto;height:100%}
  .screen{height:100%;display:flex;flex-direction:column;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
  .screen[hidden]{display:none}
  .btn{background:var(--panel);color:var(--text);border:0;border-radius:10px;padding:8px 11px;font-size:14px;font-family:inherit;cursor:pointer}
  .btn:active{opacity:.7}
  .coin{color:var(--gold);font-weight:bold}
  header{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px;gap:6px}
  header .ttl{font-size:17px;font-weight:bold}

  /* لابی */
  #lobby{align-items:center;justify-content:center;text-align:center;gap:14px}
  .logo{font-size:56px;line-height:1}
  #lobby h1{margin:0;font-size:34px}
  #lobby .sub{opacity:.7;font-size:14px;margin-top:-6px}
  .big{background:var(--accent);color:#fff;border:0;border-radius:18px;padding:16px 56px;font-size:24px;font-weight:bold;font-family:inherit;cursor:pointer;margin-top:10px}
  .big:active{opacity:.75}
  .lrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #lvInfo{font-size:15px}
  #stats{font-size:12px;opacity:.7}

  /* مراحل */
  #grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:7px;direction:rtl;align-content:stretch;padding:2px}
  .lv{position:relative;background:var(--panel);color:var(--text);border:2px solid #333a68;border-radius:12px;font-family:inherit;font-size:18px;font-weight:bold;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.3}
  .lv small{font-size:10px;min-height:12px;font-weight:normal}
  .lv.done{border-color:var(--green)}
  .lv.cur{border-color:var(--gold);background:#3a3550}
  .lv.boss{color:#ff9f6b}
  .lv.locked{opacity:.4}
  .lv:active{opacity:.7}
  .pager{display:flex;gap:6px;align-items:center;justify-content:space-between;padding-top:8px}
  .pager .mid{font-size:12px;opacity:.8;text-align:center;flex:1;line-height:1.6}

  /* بازی */
  #stage{flex:1;min-height:0;display:flex;flex-direction:column}
  #board{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
  .row{display:flex;gap:6px;direction:rtl}
  .tile{width:var(--ts);height:var(--ts);border-radius:9px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:calc(var(--ts)*.52);font-weight:bold;border:2px solid transparent;transition:background-color .25s}
  .tile.filled{border-color:#5a6199}
  .tile.ghost{color:#ffffff66;border:2px dashed var(--gold)}
  .tile.green{background:var(--green);border-color:var(--green)}
  .tile.yellow{background:var(--yellow);border-color:var(--yellow)}
  .tile.gray{background:var(--gray);border-color:var(--gray)}
  .tile.pop{animation:pop .3s ease both}
  @keyframes pop{50%{transform:scale(1.14)}}
  .row.shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #hints{display:flex;gap:6px;justify-content:center;padding:6px 0}
  .hint{flex:1;background:var(--panel);color:var(--text);border:1px solid #333a68;border-radius:11px;padding:7px 2px;font-family:inherit;font-size:12px;cursor:pointer;line-height:1.5}
  .hint:active{opacity:.7}.hint b{color:var(--gold)}
  #kb{display:flex;flex-direction:column;gap:5px}
  .krow{display:flex;gap:4px;direction:rtl}
  .key{flex:1;min-width:0;height:44px;border:0;border-radius:8px;background:var(--panel);color:var(--text);font-size:18px;font-family:inherit;padding:0;cursor:pointer}
  .key:active{opacity:.6}
  .key.wide{flex:1.7;font-size:14px;background:var(--accent)}
  .key.green{background:var(--green)}.key.yellow{background:var(--yellow)}.key.gray{background:#2a2e4a;opacity:.45}

  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center;max-width:90%}
  #toast.show{opacity:1}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:30}
  #modal.show{display:flex}
  #mbox{background:var(--panel);border-radius:18px;padding:20px 18px;width:90%;max-width:380px;text-align:center;max-height:90%;overflow:auto}
  #mbox h2{margin:0 0 8px;font-size:20px}
  #mbox p{margin:6px 0 12px;line-height:1.9;font-size:14px}
  .primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-size:15px;font-family:inherit;cursor:pointer}
  .primary:active{opacity:.7}
  .primary.gold{background:var(--gold);color:#2b2100;font-weight:bold}
  .primary:disabled{opacity:.4}
  .ghostbtn{background:transparent;color:#aab;border:0;font-family:inherit;font-size:13px;padding:10px;cursor:pointer}
  .btns{display:flex;flex-direction:column;gap:8px;margin-top:10px;align-items:stretch}
  .demo{display:flex;gap:5px;justify-content:center;direction:rtl;margin:8px 0}
  .demo .tile{--ts:38px}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:#444a78}.dot.on{background:var(--gold)}
  .pack{display:flex;align-items:center;justify-content:space-between;background:var(--tile);border-radius:12px;padding:10px 12px;margin:7px 0;gap:8px}
  .pack .tag{font-size:11px;background:var(--green);border-radius:6px;padding:1px 6px;margin-right:6px}
  .bal{font-size:26px;color:var(--gold);font-weight:bold;margin:2px 0 8px}
  .stars{font-size:30px;letter-spacing:4px}
  .lite *{animation:none!important;transition:none!important}
  @media (max-height:640px){.key{height:38px}.hint{font-size:11px}.big{padding:13px 44px;font-size:21px}}
</style>
</head>
<body>
<div id="app">

  <!-- ========== لابی ========== -->
  <section id="lobby" class="screen">
    <div class="logo">🔤</div>
    <h1>کلمه‌یاب</h1>
    <div class="sub">کلمه‌ی پنهان رو پیدا کن!</div>
    <div id="lvInfo"></div>
    <button class="big" id="startBtn">▶ شروع</button>
    <div class="lrow">
      <button class="btn coin" data-shop>🪙 <span class="cn">0</span> ＋</button>
      <button class="btn" id="helpBtn">❓ آموزش</button>
      <button class="btn" id="liteBtn">⚡ حالت سبک</button>
    </div>
    <div id="stats"></div>
  </section>

  <!-- ========== انتخاب مرحله ========== -->
  <section id="levels" class="screen" hidden>
    <header>
      <button class="btn" id="lvBack">➜ لابی</button>
      <div class="ttl">مراحل</div>
      <button class="btn coin" data-shop>🪙 <span class="cn">0</span></button>
    </header>
    <div id="grid"></div>
    <div class="pager">
      <button class="btn" id="pgPrev">▶ قبلی</button>
      <div class="mid"><span id="pgInfo"></span><br><button class="ghostbtn" id="pgMe" style="padding:0">🎯 مرحله‌ی من</button></div>
      <button class="btn" id="pgNext">بعدی ◀</button>
    </div>
  </section>

  <!-- ========== بازی ========== -->
  <section id="game" class="screen" hidden>
    <header>
      <button class="btn" id="gBack">➜ مراحل</button>
      <div class="ttl" id="gTitle"></div>
      <button class="btn coin" data-shop>🪙 <span class="cn">0</span> ＋</button>
    </header>
    <div id="stage"><div id="board"></div></div>
    <div id="hints">
      <button class="hint" id="hLetter">💡 افشای حرف<br><b id="cLetter"></b> 🪙</button>
      <button class="hint" id="hClean">🧹 حذف حروف اشتباه<br><b id="cClean"></b> 🪙</button>
      <button class="hint" id="hRow">➕ تلاش اضافه<br><b id="cRow"></b> 🪙</button>
    </div>
    <div id="kb"></div>
  </section>

</div>
<div id="toast"></div>
<div id="modal"><div id="mbox"></div></div>

<script>
/* ===================== تنظیمات ===================== */
const CONFIG = {
  DEV: true,               // قبل از انتشار حتماً false کن!
  TOTAL_LEVELS: 10000,
  PER_PAGE: 30,
  START_COINS: 30,
  DAILY_BONUS: 20,
  AD_REWARD: 15,
  ADS_PER_DAY: 8,
  COST: { letter: 10, clean: 8, row: 15 },
  PACKS: [
    { id: "coin50",  coins: 50,  price: 5000 },
    { id: "coin150", coins: 150, price: 12000, tag: "محبوب" },
    { id: "coin400", coins: 400, price: 25000, tag: "به‌صرفه" }
  ]
};

/* ===================== کلمات (۵ حرفی) ===================== */
const WORDS = [...new Set(`
آسمان پرنده ستاره مدرسه پنجره گلدان کبوتر انگور صندلی مسافر خاطره زندگی آزادی ایران تهران شیراز
بازار پرواز پاییز بیمار نقاشی دریچه فرشته پروانه شکلات شیرین مهمان چمدان عروسک پیاده بشقاب لیوان ماشین
میدان باغچه سرباز بیابان آبشار طوفان زلزله امتحان لبخند مهتاب آفتاب باران برادر خواهر فرزند کارگر
مهندس پرستار خلبان پیروز نارنج بادام فنجان شلوار جوراب موتور پرتاب شمشیر تابلو کتیبه دلاور سهراب بهرام
فرهاد مجنون آرامش ترانه تنبور سنتور دایره طبیعت شقایق سنبله بنفشه یاسمن ریحان گیلاس انجیر کلوچه قورمه
سماور چنگال بخاری یخچال رادیو سیاره عطارد کیهان سپیده
`.split(/\s+/))].filter(w => [...w].length === 5);

/* ===================== مرحله ← کلمه (بدون نیاز به ذخیره‌ی ۱۰هزار کلمه) ===================== */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const permCache = {};
function perm(cycle) {
  if (permCache[cycle]) return permCache[cycle];
  const r = rng(cycle * 9973 + 12345), a = WORDS.map((_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return (permCache[cycle] = a);
}
function wordForLevel(n) { const i = n - 1, N = WORDS.length; return WORDS[perm(Math.floor(i / N))[i % N]]; }
const isBoss = n => n % 10 === 0;

/* ===================== ذخیره‌سازی ===================== */
const KEY = "km2";
const defaults = () => ({ coins: CONFIG.START_COINS, win: 0, play: 0, streak: 0, level: 1, stars: {}, seen: false, day: "", adDay: "", ads: 0, lite: null });
function load() { try { const o = JSON.parse(localStorage.getItem(KEY)); if (o) return Object.assign(defaults(), o); } catch (e) {} return defaults(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();

const $ = id => document.getElementById(id);
const fa = n => { try { return Number(n).toLocaleString("fa-IR"); } catch (e) { return String(n); } };
const today = () => new Date().toDateString();

/* ===================== حالت سبک ===================== */
if (S.lite === null) S.lite = (navigator.hardwareConcurrency || 4) <= 4 || (navigator.deviceMemory || 4) <= 2;
function applyLite() { document.body.classList.toggle("lite", !!S.lite); $("liteBtn").style.opacity = S.lite ? 1 : .55; }

/* ===================== تبلیغ و پرداخت (جای اتصال SDK) ===================== */
function showRewardedAd(onReward) {
  // TODO: SDK تپسل / ادیوری / یکتانت رو اینجا وصل کن و در callback پاداش، onReward() رو صدا بزن
  if (!CONFIG.DEV) return toast("تبلیغ در حال حاضر در دسترس نیست");
  toast("در حال نمایش تبلیغ... (نسخه آزمایشی)");
  setTimeout(onReward, 1500);
}
function purchase(pack, onSuccess) {
  // TODO: پرداخت درون‌برنامه‌ای بازار (Poolakey) یا مایکت رو اینجا وصل کن
  if (!CONFIG.DEV) return toast("درگاه پرداخت هنوز متصل نیست");
  toast("خرید آزمایشی انجام شد");
  onSuccess();
}
function adsLeft() { return CONFIG.ADS_PER_DAY - (S.adDay === today() ? S.ads : 0); }
function watchAd(onReward) {
  if (adsLeft() <= 0) return toast("سقف تبلیغ امروز پر شده، فردا بیا 🌙");
  showRewardedAd(() => { if (S.adDay !== today()) { S.adDay = today(); S.ads = 0; } S.ads++; save(); onReward(); });
}

/* ===================== سکه ===================== */
function addCoins(n) { S.coins += n; save(); updateHud(); }
function spend(n) { if (S.coins < n) { toast("سکه کافی نیست 🪙"); openShop(); return false; } S.coins -= n; save(); updateHud(); return true; }
function updateHud() {
  document.querySelectorAll(".cn").forEach(e => e.textContent = fa(S.coins));
  $("stats").textContent = `برد: ${fa(S.win)}  |  بازی: ${fa(S.play)}  |  🔥 ${fa(S.streak)}`;
  $("lvInfo").innerHTML = `مرحله‌ی فعلی: <b class="coin">${fa(S.level)}</b> از ${fa(CONFIG.TOTAL_LEVELS)}`;
}
function dailyBonus() {
  if (S.day === today()) return;
  S.day = today(); addCoins(CONFIG.DAILY_BONUS);
  toast(`🎁 هدیه‌ی روزانه: ${fa(CONFIG.DAILY_BONUS)} سکه میثی`);
}

/* ===================== ناوبری صفحه‌ها ===================== */
let page = 0;
function show(name) {
  ["lobby", "levels", "game"].forEach(id => $(id).hidden = id !== name);
  updateHud();
  if (name === "levels") renderLevels();
  if (name === "game") requestAnimationFrame(fit);
}

/* ===================== صفحه‌ی مراحل ===================== */
function renderLevels() {
  const pages = Math.ceil(CONFIG.TOTAL_LEVELS / CONFIG.PER_PAGE);
  page = Math.max(0, Math.min(pages - 1, page));
  const start = page * CONFIG.PER_PAGE + 1, end = Math.min(CONFIG.TOTAL_LEVELS, start + CONFIG.PER_PAGE - 1);
  let h = "";
  for (let n = start; n <= end; n++) {
    const st = S.stars[n] || 0, locked = n > S.level;
    h += `<button class="lv${locked ? " locked" : ""}${n === S.level ? " cur" : ""}${st ? " done" : ""}${isBoss(n) ? " boss" : ""}" data-n="${n}">${fa(n)}<small>${locked ? "🔒" : st ? "⭐".repeat(st) : isBoss(n) ? "🔥" : ""}</small></button>`;
  }
  $("grid").innerHTML = h;
  $("pgInfo").textContent = `مراحل ${fa(start)} تا ${fa(end)}  (صفحه ${fa(page + 1)} از ${fa(pages)})`;
}
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".lv"); if (!b) return;
  const n = +b.dataset.n;
  if (n > S.level) return toast("🔒 اول مرحله‌ی قبلی رو ببر");
  startLevel(n);
});
$("pgPrev").addEventListener("click", () => { page--; renderLevels(); });
$("pgNext").addEventListener("click", () => { page++; renderLevels(); });
$("pgMe").addEventListener("click", () => { page = Math.floor((S.level - 1) / CONFIG.PER_PAGE); renderLevels(); });
$("lvBack").addEventListener("click", () => show("lobby"));
$("gBack").addEventListener("click", () => show("levels"));
$("startBtn").addEventListener("click", () => { page = Math.floor((S.level - 1) / CONFIG.PER_PAGE); show("levels"); });

/* ===================== کیبورد ===================== */
const LAYOUT = [
  "ضصثقفغعهخحجچ".split(""),
  "شسیبلاتنمکگ".split(""),
  ["ENTER", ..."ظطزرذدپوئآ".split(""), "DEL"]
];
const LETTERS = LAYOUT.flat().filter(k => k !== "ENTER" && k !== "DEL");
const keyEls = {};
function buildKeyboard() {
  const kb = $("kb");
  LAYOUT.forEach(keys => {
    const row = document.createElement("div"); row.className = "krow";
    keys.forEach(k => {
      const b = document.createElement("button"); b.className = "key"; b.dataset.k = k;
      if (k === "ENTER") { b.textContent = "ثبت"; b.classList.add("wide"); }
      else if (k === "DEL") { b.textContent = "⌫"; b.classList.add("wide"); }
      else { b.textContent = k; keyEls[k] = b; }
      row.appendChild(b);
    });
    kb.appendChild(row);
  });
  kb.addEventListener("click", e => { const b = e.target.closest(".key"); if (b) press(b.dataset.k); });
}
function resetKeys() { for (const k in keyEls) keyEls[k].className = "key"; }

/* ===================== بازی ===================== */
const COLS = 5;
let curLevel, baseRows, ROWS, secret, guesses, current, over, keyState, hintLetters, extraUsed, revived, tiles, rowEls, lastReward;
const boardEl = $("board");

function startLevel(n) {
  closeModal();
  curLevel = n; secret = wordForLevel(n);
  baseRows = ROWS = isBoss(n) ? 5 : 6;
  guesses = []; current = []; over = false; keyState = {}; hintLetters = {};
  extraUsed = false; revived = false; lastReward = 0;
  tiles = []; rowEls = []; boardEl.innerHTML = "";
  for (let r = 0; r < ROWS; r++) createRow();
  resetKeys();
  $("gTitle").textContent = `مرحله ${fa(n)}${isBoss(n) ? " 🔥 سخت" : ""}`;
  show("game");
}
function createRow() {
  const row = document.createElement("div"); row.className = "row";
  const arr = [];
  for (let c = 0; c < COLS; c++) { const t = document.createElement("div"); t.className = "tile"; row.appendChild(t); arr.push(t); }
  boardEl.appendChild(row); rowEls.push(row); tiles.push(arr);
}
function fit() {
  const h = boardEl.clientHeight, w = boardEl.clientWidth, gap = 6;
  if (!h) return;
  const s = Math.floor(Math.min(56, (h - (ROWS - 1) * gap) / ROWS, (w - 4 * gap) / COLS));
  boardEl.style.setProperty("--ts", Math.max(28, s) + "px");
}
let rz; window.addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(fit); });

function paintCurrent() {
  const r = guesses.length; if (r >= ROWS) return;
  for (let c = 0; c < COLS; c++) {
    const t = tiles[r][c], ch = current[c];
    if (ch) { t.textContent = ch; t.className = "tile filled"; }
    else if (hintLetters[c]) { t.textContent = hintLetters[c]; t.className = "tile ghost"; }
    else { t.textContent = ""; t.className = "tile"; }
  }
}
function evaluate(g) {
  const gs = [...g], ss = [...secret], res = Array(COLS).fill("gray"), left = {};
  for (let i = 0; i < COLS; i++) { if (gs[i] === ss[i]) res[i] = "green"; else left[ss[i]] = (left[ss[i]] || 0) + 1; }
  for (let i = 0; i < COLS; i++) { if (res[i] !== "green" && left[gs[i]] > 0) { res[i] = "yellow"; left[gs[i]]--; } }
  return res;
}
function press(k) {
  if (over) return;
  if (k === "ENTER") return submit();
  if (k === "DEL") { current.pop(); return paintCurrent(); }
  if (current.length < COLS) { current.push(k); paintCurrent(); }
}
document.addEventListener("keydown", e => {
  if ($("game").hidden || $("modal").classList.contains("show")) return;
  if (e.key === "Enter") press("ENTER");
  else if (e.key === "Backspace") press("DEL");
  else { const ch = e.key.replace("ي", "ی").replace("ك", "ک"); if (/^[\u0600-\u06FF]$/.test(ch)) press(ch); }
});

function submit() {
  const r = guesses.length;
  if (current.length < COLS) {
    const row = rowEls[r]; row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
    return toast("کلمه باید ۵ حرفی باشه");
  }
  const word = current.join(""), res = evaluate(word);
  guesses.push(word); current = [];
  const rank = { gray: 1, yellow: 2, green: 3 };
  [...word].forEach((ch, c) => {
    const t = tiles[r][c];
    t.textContent = ch; t.className = "tile " + res[c] + (S.lite ? "" : " pop");
    t.style.animationDelay = (c * 80) + "ms";
    const old = keyState[ch];
    if (!old || rank[res[c]] > rank[old]) { keyState[ch] = res[c]; keyEls[ch].className = "key " + res[c]; }
  });
  if (word === secret) return finish(true);
  if (guesses.length >= ROWS) return finish(false);
  paintCurrent();
}

function finish(win) {
  over = true; S.play++;
  let stars = 0, first = false;
  if (win) {
    S.win++; S.streak++;
    const att = guesses.length;
    stars = att <= 2 ? 3 : att <= 4 ? 2 : 1;
    first = !S.stars[curLevel];
    if (stars > (S.stars[curLevel] || 0)) S.stars[curLevel] = stars;
    if (curLevel === S.level && S.level < CONFIG.TOTAL_LEVELS) S.level++;
    lastReward = first ? Math.max(10, 10 + (baseRows + 1 - att) * 2) * (isBoss(curLevel) ? 2 : 1) : 0;
    if (lastReward) addCoins(lastReward);
  } else S.streak = 0;
  save(); updateHud();
  setTimeout(() => {
    if (win) {
      const hasNext = curLevel < CONFIG.TOTAL_LEVELS;
      openModal(`
        <h2>🎉 آفرین!</h2>
        <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
        <p>کلمه‌ی «${secret}» رو در ${fa(guesses.length)} تلاش پیدا کردی.<br>
        ${lastReward ? `<b class="coin">+${fa(lastReward)} سکه میثی 🪙</b>` : `<span style="opacity:.7">جایزه‌ی سکه فقط بار اوله</span>`}</p>
        <div class="btns">
          ${lastReward ? `<button class="primary gold" data-act="double">🎬 دو برابر کن (دیدن تبلیغ)</button>` : ""}
          ${hasNext ? `<button class="primary" data-act="nextlevel">مرحله‌ی بعد ◀</button>` : ""}
          <button class="ghostbtn" data-act="tolevels">بازگشت به مراحل</button>
        </div>`);
    } else {
      openModal(`
        <h2>😅 این دفعه نشد</h2>
        <p>کلمه‌ی درست: <b>${secret}</b></p>
        <div class="btns">
          ${revived ? "" : `<button class="primary gold" data-act="revive">🎬 یه فرصت دیگه (دیدن تبلیغ)</button>`}
          <button class="primary" data-act="retry">🔄 دوباره امتحان کن</button>
          <button class="ghostbtn" data-act="tolevels">بازگشت به مراحل</button>
        </div>`);
    }
  }, S.lite ? 100 : 600);
}

/* ===================== راهنماها ===================== */
$("hLetter").addEventListener("click", () => {
  if (over) return;
  const known = new Set();
  guesses.forEach(g => evaluate(g).forEach((v, i) => { if (v === "green") known.add(i); }));
  const free = [0, 1, 2, 3, 4].filter(i => !known.has(i) && !hintLetters[i]);
  if (!free.length) return toast("همه‌ی حرف‌ها پیدا یا لو رفته!");
  if (!spend(CONFIG.COST.letter)) return;
  const i = free[Math.floor(Math.random() * free.length)];
  hintLetters[i] = [...secret][i]; paintCurrent();
  toast(`💡 حرف شماره ${fa(i + 1)} کلمه: «${hintLetters[i]}»`);
});
$("hClean").addEventListener("click", () => {
  if (over) return;
  const cand = LETTERS.filter(ch => !secret.includes(ch) && !keyState[ch]);
  if (!cand.length) return toast("حرف اشتباه دیگه‌ای نمونده");
  if (!spend(CONFIG.COST.clean)) return;
  cand.sort(() => Math.random() - .5).slice(0, 5).forEach(ch => { keyState[ch] = "gray"; keyEls[ch].className = "key gray"; });
  toast("🧹 ۵ حرف اشتباه حذف شد");
});
function addRow() { ROWS++; createRow(); fit(); }
$("hRow").addEventListener("click", () => {
  if (over) return;
  if (extraUsed) return toast("تلاش اضافه فقط یک بار در هر مرحله");
  if (!spend(CONFIG.COST.row)) return;
  extraUsed = true; addRow(); toast("➕ یک تلاش اضافه گرفتی");
});

/* ===================== مودال‌ها ===================== */
let modalName = "";
function openModal(html, name) { $("mbox").innerHTML = html; $("modal").classList.add("show"); modalName = name || ""; }
function closeModal() { $("modal").classList.remove("show"); modalName = ""; }

function openShop() {
  const packs = CONFIG.PACKS.map(p => `
    <div class="pack">
      <div>🪙 <b>${fa(p.coins)}</b> سکه${p.tag ? `<span class="tag">${p.tag}</span>` : ""}</div>
      <button class="primary" data-act="buy" data-id="${p.id}">${fa(p.price)} تومان</button>
    </div>`).join("");
  openModal(`
    <h2>🪙 فروشگاه سکه میثی</h2>
    <div class="bal">${fa(S.coins)}</div>
    <button class="primary gold" data-act="ad" style="width:100%">🎬 ${fa(CONFIG.AD_REWARD)} سکه رایگان با دیدن تبلیغ<br><small>(${fa(Math.max(0, adsLeft()))} بار باقی مانده امروز)</small></button>
    ${packs}
    <button class="ghostbtn" data-act="close">بستن</button>`, "shop");
}
document.querySelectorAll("[data-shop]").forEach(b => b.addEventListener("click", openShop));

const SLIDES = [
  { t: "🔤 طرز بازی", h: () => `
      <p>یه کلمه‌ی ۵ حرفی مخفی هست. در ۶ تلاش پیداش کن!</p>
      <div class="demo">${[["ب","green"],["ا","green"],["ز","gray"],["ا","green"],["ر","yellow"]].map(x => `<div class="tile ${x[1]}">${x[0]}</div>`).join("")}</div>
      <p>🟩 حرف درسته و جاش هم درسته<br>🟨 حرف تو کلمه هست ولی جاش اشتباهه<br>⬜ این حرف تو کلمه نیست</p>` },
  { t: "🗺️ مرحله‌ها", h: () => `
      <p>${fa(CONFIG.TOTAL_LEVELS)} مرحله منتظرته!<br>
      با بردن هر مرحله، مرحله‌ی بعدی باز می‌شه 🔓<br>
      هرچی زودتر پیدا کنی ستاره‌ی بیشتری می‌گیری ⭐⭐⭐<br>
      هر مرحله‌ی دهم، مرحله‌ی سخت 🔥 با جایزه‌ی دو برابر!</p>` },
  { t: "🪙 سکه میثی", h: () => `
      <p>سکه میثی پول بازیه! با سکه می‌تونی راهنما بگیری:</p>
      <p>💡 <b>افشای حرف</b> (${fa(CONFIG.COST.letter)} سکه)<br>
      🧹 <b>حذف ۵ حرف اشتباه</b> (${fa(CONFIG.COST.clean)} سکه)<br>
      ➕ <b>تلاش اضافه</b> (${fa(CONFIG.COST.row)} سکه)</p>` },
  { t: "🎁 سکه از کجا بیارم؟", h: () => `
      <p>✅ شروع بازی: <b>${fa(CONFIG.START_COINS)}</b> سکه هدیه<br>
      ✅ هر روز: <b>${fa(CONFIG.DAILY_BONUS)}</b> سکه هدیه‌ی روزانه<br>
      ✅ بردن هر مرحله برای بار اول: سکه‌ی جایزه<br>
      ✅ دیدن تبلیغ: <b>${fa(CONFIG.AD_REWARD)}</b> سکه رایگان<br>
      ✅ یا از فروشگاه بخر</p>` }
];
function showTutorial(i) {
  const s = SLIDES[i], last = i === SLIDES.length - 1;
  openModal(`
    <h2>${s.t}</h2>${s.h()}
    <div class="dots">${SLIDES.map((_, k) => `<span class="dot ${k === i ? "on" : ""}"></span>`).join("")}</div>
    <div class="btns">
      ${last ? `<button class="primary gold" data-act="tdone">بزن بریم! 🎮</button>`
             : `<button class="primary" data-act="tnext" data-i="${i + 1}">بعدی</button><button class="ghostbtn" data-act="tdone">رد کردن</button>`}
    </div>`, "tutorial");
}

$("modal").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "tnext") showTutorial(+b.dataset.i);
  else if (a === "tdone") { S.seen = true; save(); closeModal(); dailyBonus(); }
  else if (a === "close") closeModal();
  else if (a === "nextlevel") startLevel(curLevel + 1);
  else if (a === "retry") startLevel(curLevel);
  else if (a === "tolevels") { closeModal(); page = Math.floor((S.level - 1) / CONFIG.PER_PAGE); show("levels"); }
  else if (a === "ad") watchAd(() => { addCoins(CONFIG.AD_REWARD); toast(`🎬 +${fa(CONFIG.AD_REWARD)} سکه`); if (modalName === "shop") openShop(); });
  else if (a === "buy") { const p = CONFIG.PACKS.find(x => x.id === b.dataset.id); purchase(p, () => { addCoins(p.coins); openShop(); }); }
  else if (a === "double") watchAd(() => { addCoins(lastReward); b.disabled = true; b.textContent = "✅ دو برابر شد!"; });
  else if (a === "revive") watchAd(() => { revived = true; over = false; addRow(); closeModal(); paintCurrent(); toast("➕ یه فرصت دیگه گرفتی!"); });
});

/* ===================== دکمه‌های لابی ===================== */
$("helpBtn").addEventListener("click", () => showTutorial(0));
$("liteBtn").addEventListener("click", () => { S.lite = !S.lite; save(); applyLite(); toast(S.lite ? "⚡ حالت سبک روشن شد" : "✨ افکت‌ها روشن شد"); });

let tt;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }

/* ===================== شروع ===================== */
$("cLetter").textContent = fa(CONFIG.COST.letter);
$("cClean").textContent = fa(CONFIG.COST.clean);
$("cRow").textContent = fa(CONFIG.COST.row);
applyLite(); buildKeyboard(); show("lobby");
if (!S.seen) showTutorial(0); else dailyBonus();
</script>
</body>
</html>
