<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e3b43">
<title>کلمه‌یاب</title>
<style>
:root{--a:#0e3b43;--b:#1b6b4a;--c1:#3ddc84;--c2:#ffd54a;--ts:50px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:Tahoma,"Vazirmatn","IRANSans",sans-serif;background-color:var(--a)}
body{background-image:linear-gradient(160deg,var(--a),var(--b));background-attachment:fixed}
.bg{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);animation:drift 16s ease-in-out infinite alternate}
.bg i:nth-child(1){width:220px;height:220px;left:-60px;top:8%}
.bg i:nth-child(2){width:160px;height:160px;right:-40px;top:30%;animation-duration:21s}
.bg i:nth-child(3){width:260px;height:260px;left:20%;bottom:-90px;animation-duration:25s}
.bg i:nth-child(4){width:110px;height:110px;right:15%;top:-30px;animation-duration:19s}
.bg i:nth-child(5){width:140px;height:140px;left:5%;bottom:30%;animation-duration:23s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(24px,-34px,0) scale(1.15)}}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:40}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;height:100%}
.screen{height:100%;display:flex;flex-direction:column;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.screen[hidden]{display:none}

.chip{background-image:linear-gradient(180deg,#ffe27a,#f4a81d);color:#4a2c00;border:0;border-radius:20px;padding:7px 14px;font-weight:800;font-family:inherit;font-size:15px;box-shadow:0 3px 0 #b36f00;cursor:pointer}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #b36f00}
.ico{width:40px;height:40px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.22);cursor:pointer;padding:0}
.ico:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:14px;padding:9px 13px;font-size:14px;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.22);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn:disabled{opacity:.35}
.hd{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;gap:6px}
.tb{display:flex;gap:8px}

/* لابی */
#lobby{align-items:stretch}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.logo{font-size:64px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.brand{margin:6px 0 0;font-size:46px;font-weight:900;background-image:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bff95,#4dc3ff,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sub{opacity:.85;font-size:14px;margin-top:2px}
.lvchip{margin-top:12px;background:rgba(0,0,0,.25);border-radius:16px;padding:7px 16px;font-size:14px}
.play{border:0;border-radius:26px;padding:17px 0;font-size:26px;font-weight:900;font-family:inherit;color:#10231a;background-image:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.3);cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3);animation:none}
@keyframes pulse{50%{transform:scale(1.04)}}
.cards{display:flex;gap:10px;margin-top:14px}
.card{flex:1;position:relative;border:0;border-radius:18px;padding:14px 4px;background:rgba(255,255,255,.13);color:#fff;font-family:inherit;font-size:28px;box-shadow:0 4px 0 rgba(0,0,0,.22);cursor:pointer}
.card span{display:block;font-size:13px;margin-top:4px}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.dot{position:absolute;top:8px;left:10px;width:12px;height:12px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 3px rgba(255,77,109,.35)}
#stats{text-align:center;font-size:12px;opacity:.75;padding-top:12px}

/* نقشه */
.wt{text-align:center;line-height:1.35}
.wt b{font-size:17px}
.bar{width:120px;height:7px;border-radius:5px;background:rgba(0,0,0,.3);margin:4px auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;background-image:linear-gradient(90deg,var(--c1),var(--c2))}
.mapwrap{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:14px 2px}
.mrow{position:relative;display:flex;justify-content:space-around;margin-bottom:22px}
.mrow:last-child{margin-bottom:0}
.mrow::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:6px;margin-top:-3px;background:rgba(255,255,255,.2);border-radius:4px}
.mrow.rtl:not(:last-child)::after,.mrow.ltr:not(:last-child)::after{content:"";position:absolute;bottom:-22px;width:6px;height:22px;background:rgba(255,255,255,.2)}
.mrow.rtl:not(:last-child)::after{left:10%;margin-left:-3px}
.mrow.ltr:not(:last-child)::after{right:10%;margin-right:-3px}
.nd{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background-image:linear-gradient(180deg,#8087b8,#4d5483);color:#fff;font-family:inherit;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0;box-shadow:0 4px 0 rgba(0,0,0,.28);cursor:pointer}
.nd small{font-size:9px;min-height:11px}
.nd:active{transform:translateY(2px)}
.nd.done{background-image:linear-gradient(180deg,#43e08a,#1fa35a);border-color:#c8ffe0}
.nd.cur{background-image:linear-gradient(180deg,#ffe27a,#f4a81d);color:#4a2c00;border-color:#fff;animation:pulse 1.4s ease-in-out infinite}
.nd.locked{opacity:.55;background-image:linear-gradient(180deg,#5b6288,#3b4166)}
.nd.boss{border-color:#ffc2ae;background-image:linear-gradient(180deg,#ff8a5c,#d9381e)}
.nd.boss.locked{background-image:linear-gradient(180deg,#8a5a56,#573432)}
.nd.boss::before{content:"👑";position:absolute;top:-15px;font-size:15px}
.pager{display:flex;gap:6px;justify-content:center;padding-top:10px}

/* بازی */
.gt{text-align:center;line-height:1.35}
.gt b{font-size:17px}
.gt small{display:block;opacity:.8;font-size:11px}
#board{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center}
.row{display:flex;gap:6px;direction:rtl;margin-bottom:6px}
.tile{width:var(--ts);height:var(--ts);border-radius:12px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:#fff;font-weight:800;font-size:calc(var(--ts)*.5);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tile.filled{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.2);animation:pop .15s ease-out}
.tile.ghost{color:rgba(255,255,255,.55);border:2px dashed var(--c2)}
.tile.green{background-image:linear-gradient(180deg,#43e08a,#1fa35a);border-color:#1fa35a;box-shadow:0 3px 0 #0f6b39}
.tile.yellow{background-image:linear-gradient(180deg,#ffd35a,#e49a14);border-color:#e49a14;box-shadow:0 3px 0 #8f5d08}
.tile.gray{background-image:linear-gradient(180deg,#6a7199,#454b6f);border-color:#454b6f;box-shadow:0 3px 0 #2a2e48}
.tile.flip{animation:flip .5s ease both}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.row.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#hints{display:flex;gap:7px;padding:6px 0}
.hint{flex:1;border:0;border-radius:14px;padding:7px 2px;font-family:inherit;font-size:12px;color:#fff;line-height:1.5;background:rgba(255,255,255,.14);border-bottom:3px solid rgba(0,0,0,.25);cursor:pointer}
.hint:active{transform:translateY(2px);border-bottom-width:1px}
.hint b{color:#ffd54a}
#kb{display:flex;flex-direction:column}
.krow{display:flex;gap:4px;direction:rtl;margin-bottom:5px}
.key{flex:1;min-width:0;height:46px;border:0;border-radius:10px;background:rgba(255,255,255,.17);color:#fff;font-size:19px;font-weight:700;font-family:inherit;padding:0;border-bottom:3px solid rgba(0,0,0,.28);cursor:pointer}
.key:active{transform:translateY(2px);border-bottom-width:1px}
.key.wide{flex:1.7;font-size:14px}
.key.ent{background-image:linear-gradient(180deg,var(--c1),var(--c2));color:#10231a}
.key.del{background-image:linear-gradient(180deg,#ff7a8a,#d6334f)}
.key.green{background-image:linear-gradient(180deg,#43e08a,#1fa35a)}
.key.yellow{background-image:linear-gradient(180deg,#ffd35a,#e49a14)}
.key.gray{background:rgba(0,0,0,.28);opacity:.5}

/* پنجره‌ها */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;text-align:center;max-width:90%}
#toast.show{opacity:1}
#modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50}
#modal.show{display:flex}
#mbox{background-image:linear-gradient(180deg,#2f3573,#1b1f4a);border:2px solid rgba(255,255,255,.18);border-radius:24px;padding:20px 16px;width:90%;max-width:380px;text-align:center;max-height:92%;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.3);animation:mpop .25s ease-out}
@keyframes mpop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#mbox h2{margin:0 0 8px;font-size:21px}
#mbox p{margin:6px 0 12px;line-height:1.9;font-size:14px}
.primary{background-image:linear-gradient(180deg,#8b97ff,#5a67e6);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 4px 0 #3340b0;cursor:pointer}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #3340b0}
.primary.gold{background-image:linear-gradient(180deg,#ffe27a,#f4a81d);color:#4a2c00;box-shadow:0 4px 0 #b36f00}
.primary:disabled{opacity:.45}
.ghostbtn{background:transparent;color:#b8bde6;border:0;font-family:inherit;font-size:13px;padding:10px;cursor:pointer}
.btns{display:flex;flex-direction:column;margin-top:10px}
.btns>*{margin-bottom:9px}
.demo{display:flex;gap:5px;justify-content:center;direction:rtl;margin:8px 0}
.demo .tile{--ts:38px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.dt{width:8px;height:8px;border-radius:50%;background:#555c99}.dt.on{background:#ffd54a}
.pack{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;margin:8px 0}
.pack .tag{font-size:11px;background:#1fa35a;border-radius:6px;padding:1px 6px;margin-right:6px}
.bal{font-size:28px;color:#ffd54a;font-weight:900;margin:2px 0 8px}
.stars{font-size:38px;letter-spacing:6px}
.stars span{display:inline-block;animation:starIn .5s both}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.day{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 2px;font-size:12px;border:2px solid transparent}
.day b{display:block;font-size:17px;color:#ffd54a}
.day.last{grid-column:span 2}
.day.done{opacity:.45}
.day.today{border-color:#ffd54a;background:rgba(255,213,74,.2)}
.wheelwrap{position:relative;width:230px;height:230px;margin:14px auto 8px}
.wheel{position:relative;width:100%;height:100%;border-radius:50%;border:6px solid #fff;background-image:conic-gradient(#ff6b6b 0 60deg,#ffd93d 60deg 120deg,#6bff95 120deg 180deg,#4dc3ff 180deg 240deg,#c77dff 240deg 300deg,#ff9f43 300deg 360deg)}
.lab{position:absolute;left:50%;top:50%;width:40px;height:22px;margin:-11px 0 0 -20px;text-align:center;line-height:22px;font-weight:900;font-size:18px;color:#2b1a00}
.ptr{position:absolute;top:-16px;left:50%;margin-left:-12px;font-size:28px;color:#fff;z-index:2;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.hub{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(0,0,0,.2)}
.lite .bg{display:none}
.lite *{animation:none!important;transition:none!important}
@media (max-height:640px){.key{height:40px}.hint{font-size:11px}.logo{font-size:48px}.brand{font-size:38px}.play{padding:13px 0;font-size:22px}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>
<div id="app">

  <section id="lobby" class="screen">
    <div class="hd">
      <button class="chip" data-shop>🪙 <span class="cn">0</span> ＋</button>
      <div class="tb">
        <button class="ico" id="sndBtn">🔊</button>
        <button class="ico" id="liteBtn">⚡</button>
        <button class="ico" id="helpBtn">❓</button>
      </div>
    </div>
    <div class="hero">
      <div class="logo">🔤</div>
      <h1 class="brand">کلمه‌یاب</h1>
      <div class="sub">کلمه‌ی پنهان رو پیدا کن!</div>
      <div class="lvchip" id="lvInfo"></div>
    </div>
    <button class="play" id="startBtn">▶ شروع بازی</button>
    <div class="cards">
      <button class="card" id="dailyBtn">🎁<span>جایزه‌ی روزانه</span><i class="dot" id="dailyDot"></i></button>
      <button class="card" id="wheelBtn">🎡<span>چرخ شانس</span><i class="dot" id="wheelDot"></i></button>
    </div>
    <div id="stats"></div>
  </section>

  <section id="levels" class="screen" hidden>
    <div class="hd">
      <button class="btn" id="lvBack">➜ لابی</button>
      <div class="wt"><b id="wName"></b><div class="bar"><i id="wBar"></i></div></div>
      <button class="chip" data-shop>🪙 <span class="cn">0</span></button>
    </div>
    <div class="mapwrap" id="map"></div>
    <div class="pager">
      <button class="btn" id="pgPrev10">⏪</button>
      <button class="btn" id="pgPrev">▶ قبلی</button>
      <button class="btn" id="pgMe">🎯</button>
      <button class="btn" id="pgNext">بعدی ◀</button>
      <button class="btn" id="pgNext10">⏩</button>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="hd">
      <button class="btn" id="gBack">➜ مراحل</button>
      <div class="gt"><b id="gTitle"></b><small id="gSub"></small></div>
      <button class="chip" data-shop>🪙 <span class="cn">0</span> ＋</button>
    </div>
    <div id="board"></div>
    <div id="hints">
      <button class="hint" id="hLetter">💡 افشای حرف<br><b id="cLetter"></b> 🪙</button>
      <button class="hint" id="hClean">🧹 حذف حروف اشتباه<br><b id="cClean"></b> 🪙</button>
      <button class="hint" id="hRow">➕ تلاش اضافه<br><b id="cRow"></b> 🪙</button>
    </div>
    <div id="kb"></div>
  </section>

</div>
<div id="toast"></div>
<div id="modal"><div id="mbox"></div></div>

<script>
/* ===================== تنظیمات ===================== */
const CONFIG = {
  DEV: true,                 // قبل از انتشار حتماً false کن!
  TOTAL_LEVELS: 10000,
  PER_WORLD: 25,             // هر ۲۵ مرحله یک جهان با رنگ و تم جدید
  START_COINS: 20,
  WIN_REWARD: 15,            // سکه‌ی بردن هر مرحله (فقط بار اول)
  BOSS_REWARD: 25,           // سکه‌ی مرحله‌ی سخت (هر ۱۰ مرحله)
  AD_REWARD: 10,
  ADS_PER_DAY: 8,
  DAILY: [5, 5, 8, 8, 10, 10, 20],
  COST: { letter: 10, clean: 8, row: 15 },
  WHEEL: [{v:3,w:30},{v:5,w:25},{v:2,w:20},{v:8,w:12},{v:15,w:5},{v:5,w:8}],
  PACKS: [
    { id: "coin50",  coins: 50,  price: 5000 },
    { id: "coin150", coins: 150, price: 12000, tag: "محبوب" },
    { id: "coin400", coins: 400, price: 25000, tag: "به‌صرفه" }
  ]
};

const WORLDS = [
  { n: "دشت سبز",   a: "#0e3b43", b: "#1b6b4a", c1: "#3ddc84", c2: "#ffd54a" },
  { n: "اقیانوس",   a: "#08203e", b: "#0f5c8a", c1: "#2ec4ff", c2: "#7cf5d6" },
  { n: "غروب",      a: "#3a1450", b: "#8e2c5d", c1: "#ff7a59", c2: "#ffd166" },
  { n: "کهکشان",    a: "#120a33", b: "#3b1d7a", c1: "#9b6bff", c2: "#ff6bd6" },
  { n: "صحرا",      a: "#3b2a14", b: "#8a5a1f", c1: "#ffb347", c2: "#ff7a45" },
  { n: "یخ‌زار",    a: "#0b2740", b: "#2a6f97", c1: "#8ee3ff", c2: "#ffffff" },
  { n: "آتشفشان",   a: "#2b0a0a", b: "#7a1f12", c1: "#ff5a36", c2: "#ffc233" },
  { n: "جنگل شب",   a: "#07251f", b: "#14534a", c1: "#21e6a1", c2: "#b6ff5c" }
];

/* ===================== کلمات (۵ حرفی) ===================== */
const WORDS = [...new Set(`
آسمان پرنده ستاره مدرسه پنجره گلدان کبوتر انگور صندلی مسافر خاطره زندگی آزادی ایران تهران شیراز
بازار پرواز پاییز بیمار نقاشی دریچه فرشته پروانه شکلات شیرین مهمان چمدان عروسک پیاده بشقاب لیوان ماشین
میدان باغچه سرباز بیابان آبشار طوفان زلزله امتحان لبخند مهتاب آفتاب باران برادر خواهر فرزند کارگر
مهندس پرستار خلبان پیروز نارنج بادام فنجان شلوار جوراب موتور پرتاب شمشیر تابلو کتیبه دلاور سهراب بهرام
فرهاد مجنون آرامش ترانه تنبور سنتور دایره طبیعت شقایق سنبله بنفشه یاسمن ریحان گیلاس انجیر کلوچه قورمه
سماور چنگال بخاری یخچال رادیو سیاره عطارد کیهان سپیده
آبادی آینده آموزش آزمون آرایش آسایش آفرین آوازه آیینه آلبوم ابزار احساس اراده ارزان استاد افسوس امروز
انسان انگشت اولین اینجا ایمان باهوش بدبخت برنده بلندی بهانه بیرون بیدار پایان پوشاک تاریخ تازگی تبریک
تجربه ترکیب تصمیم تعطیل تفریح تماشا توانا توفان ثانیه جایزه جوانی جواهر چندین چالاک چوپان حیوان حافظه
حقیقت حکایت حماسه خاموش خوراک خواهش خوشبو دوستی دیروز دیدار دستور دقیقه ذخیره رنگین روزنه رقابت روشنی

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const permCache = {};
function perm(cycle) {
  if (permCache[cycle]) return permCache[cycle];
  const r = rng(cycle * 9973 + 12345), a = WORDS.map((_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return (permCache[cycle] = a);
}
function wordForLevel(n) { const i = n - 1, N = WORDS.length; return WORDS[perm(Math.floor(i / N))[i % N]]; }
const isBoss = n => n % 10 === 0;
const worldOf = n => Math.floor((n - 1) / CONFIG.PER_WORLD);
const MAX_WORLD = worldOf(CONFIG.TOTAL_LEVELS);

/* ===================== صدا، لرزش، کاغذ‌رنگی ===================== */
let AC;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function tone(f, d, type, vol, when) {
  if (!S.sound) return;
  const a = ac(); if (!a) return;
  try {
    if (a.state === "suspended") a.resume();
    const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sfx = {
  tap() { tone(560, .05, "triangle", .06); },
  del() { tone(300, .06, "triangle", .05); },
  err() { tone(180, .15, "square", .04); },
  flip(i) { tone(380 + i * 70, .12, "sine", .07); },
  coin() { tone(988, .08, "square", .04); tone(1319, .18, "square", .04, .08); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, "triangle", .09, i * .11)); },
  lose() { [330, 262, 196].forEach((f, i) => tone(f, .3, "sawtooth", .045, i * .16)); }
};
function buzz(p) { if (S.sound && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

const fx = $("fx"), fctx = fx.getContext ? fx.getContext("2d") : null;
let parts = [], fxRun = false;
function confetti() {
  if (S.lite || !fctx) return;
  fx.width = window.innerWidth; fx.height = window.innerHeight;
  const cols = ["#ff6b6b", "#ffd93d", "#6bff95", "#4dc3ff", "#c77dff", "#ff9f43"];
  parts = [];
  for (let i = 0; i < 70; i++) parts.push({ x: fx.width / 2 + (Math.random() - .5) * 80, y: fx.height * .45, vx: (Math.random() - .5) * 10, vy: -Math.random() * 11 - 4, s: 6 + Math.random() * 6, c: cols[i % 6], r: Math.random() * 6, vr: (Math.random() - .5) * .4, l: 0 });
  if (!fxRun) { fxRun = true; requestAnimationFrame(stepFx); }
}
function stepFx() {
  fctx.clearRect(0, 0, fx.width, fx.height);
  let alive = 0;
  for (const p of parts) {
    p.l++; p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    if (p.y < fx.height + 20 && p.l < 120) {
      alive++; fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
      fctx.fillStyle = p.c; fctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); fctx.restore();
    }
  }
  if (alive) requestAnimationFrame(stepFx); else { fxRun = false; fctx.clearRect(0, 0, fx.width, fx.height); }
}

/* ===================== سکه ===================== */
function addCoins(n) { S.coins += n; save(); updateHud(); }
function spend(n) { if (S.coins < n) { toast("سکه کافی نیست 🪙"); sfx.err(); openShop(); return false; } S.coins -= n; save(); updateHud(); return true; }
function claimable() { return S.dayLast !== dayNum(); }
function updateHud() {
  document.querySelectorAll(".cn").forEach(e => e.textContent = fa(S.coins));
  $("stats").textContent = `برد: ${fa(S.win)}  |  بازی: ${fa(S.play)}  |  🔥 ${fa(S.streak)}`;
  $("lvInfo").innerHTML = `🗺️ مرحله‌ی ${fa(S.level)} · ${worldName(worldOf(S.level))}`;
  $("dailyDot").style.display = claimable() ? "block" : "none";
  $("wheelDot").style.display = S.wheelDay !== dayNum() ? "block" : "none";
}

/* ===================== جهان‌ها و ناوبری ===================== */
function worldName(w) { const p = WORLDS[w % WORLDS.length], c = Math.floor(w / WORLDS.length); return p.n + (c ? " " + fa(c + 1) : ""); }
function applyWorld(w) {
  const p = WORLDS[w % WORLDS.length], s = document.documentElement.style;
  s.setProperty("--a", p.a); s.setProperty("--b", p.b); s.setProperty("--c1", p.c1); s.setProperty("--c2", p.c2);
  const m = document.querySelector("meta[name=theme-color]"); if (m) m.setAttribute("content", p.a);
}
let mapPage = 0;
function show(name) {
  ["lobby", "levels", "game"].forEach(id => $(id).hidden = id !== name);
  if (name === "lobby") applyWorld(worldOf(S.level));
  if (name === "levels") { applyWorld(mapPage); renderMap(); }
  if (name === "game") { applyWorld(worldOf(curLevel)); requestAnimationFrame(fit); }
  updateHud();
}

function renderMap() {
  const maxPage = Math.min(MAX_WORLD, worldOf(S.level));
  mapPage = Math.max(0, Math.min(maxPage, mapPage));
  const start = mapPage * CONFIG.PER_WORLD + 1, end = Math.min(CONFIG.TOTAL_LEVELS, start + CONFIG.PER_WORLD - 1);
  let h = "", done = 0;
  for (let r = 0; r < 5; r++) {
    h += `<div class="mrow ${r % 2 ? "ltr" : "rtl"}" style="direction:${r % 2 ? "ltr" : "rtl"}">`;
    for (let c = 0; c < 5; c++) {
      const n = start + r * 5 + c; if (n > end) break;
      const st = S.stars[n] || 0, locked = n > S.level;
      if (st) done++;
      const cls = "nd" + (locked ? " locked" : "") + (n === S.level ? " cur" : "") + (st ? " done" : "") + (isBoss(n) ? " boss" : "");
      h += `<button class="${cls}" data-n="${n}">${locked ? "🔒" : fa(n)}<small>${locked ? "" : st ? "⭐".repeat(st) : ""}</small></button>`;
    }
    h += "</div>";
  }
  $("map").innerHTML = h;
  $("wName").textContent = `جهان ${fa(mapPage + 1)}: ${worldName(mapPage)}`;
  $("wBar").style.width = Math.round(done / (end - start + 1) * 100) + "%";
  $("pgPrev").disabled = $("pgPrev10").disabled = mapPage <= 0;
  $("pgNext").disabled = $("pgNext10").disabled = mapPage >= maxPage;
  applyWorld(mapPage);
}
$("map").addEventListener("click", e => {
  const b = e.target.closest(".nd"); if (!b) return;
  const n = +b.dataset.n;
  if (n > S.level) { sfx.err(); return toast("🔒 اول مرحله‌ی قبلی رو ببر"); }
  sfx.tap(); startLevel(n);
});
$("pgPrev").addEventListener("click", () => { mapPage--; renderMap(); });
$("pgNext").addEventListener("click", () => { mapPage++; renderMap(); });
$("pgPrev10").addEventListener("click", () => { mapPage -= 10; renderMap(); });
$("pgNext10").addEventListener("click", () => { mapPage += 10; renderMap(); });
$("pgMe").addEventListener("click", () => { mapPage = worldOf(S.level); renderMap(); });
$("lvBack").addEventListener("click", () => show("lobby"));
$("gBack").addEventListener("click", () => { runId++; mapPage = worldOf(curLevel); show("levels"); });
$("startBtn").addEventListener("click", () => { sfx.tap(); mapPage = worldOf(S.level); show("levels"); });

/* ===================== کیبورد ===================== */
const LAYOUT = [
  "ضصثقفغعهخحجچ".split(""),
  "شسیبلاتنمکگ".split(""),
  ["ENTER", ..."ظطزرذدپوئآ".split(""), "DEL"]
];
const LETTERS = LAYOUT.flat().filter(k => k !== "ENTER" && k !== "DEL");
const keyEls = {};
function buildKeyboard() {
  const kb = $("kb");
  LAYOUT.forEach(keys => {
    const row = document.createElement("div"); row.className = "krow";
    keys.forEach(k => {
      const b = document.createElement("button"); b.className = "key"; b.dataset.k = k;
      if (k === "ENTER") { b.textContent = "ثبت"; b.className = "key wide ent"; }
      else if (k === "DEL") { b.textContent = "⌫"; b.className = "key wide del"; }
      else { b.textContent = k; keyEls[k] = b; }
      row.appendChild(b);
    });
    kb.appendChild(row);
  });
  kb.addEventListener("click", e => { const b = e.target.closest(".key"); if (b) press(b.dataset.k); });
}
function resetKeys() { for (const k in keyEls) keyEls[k].className = "key"; }

/* ===================== بازی ===================== */
const COLS = 5;
let curLevel = 1, baseRows, ROWS, secret, guesses, current, over, busy, runId = 0, keyState, hintLetters, extraUsed, revived, tiles, rowEls, lastReward;
const boardEl = $("board");

function startLevel(n) {
  closeModal();
  runId++; curLevel = n; secret = wordForLevel(n);
  baseRows = ROWS = isBoss(n) ? 5 : 6;
  guesses = []; current = []; over = false; busy = false; keyState = {}; hintLetters = {};
  extraUsed = false; revived = false; lastReward = 0;
  tiles = []; rowEls = []; boardEl.innerHTML = "";
  for (let r = 0; r < ROWS; r++) createRow();
  resetKeys();
  $("gTitle").textContent = `مرحله ${fa(n)}${isBoss(n) ? " 👑" : ""}`;
  $("gSub").textContent = isBoss(n) ? "مرحله‌ی سخت · ۵ تلاش" : worldName(worldOf(n));
  show("game");
}
function createRow() {
  const row = document.createElement("div"); row.className = "row";
  const arr = [];
  for (let c = 0; c < COLS; c++) { const t = document.createElement("div"); t.className = "tile"; row.appendChild(t); arr.push(t); }
  boardEl.appendChild(row); rowEls.push(row); tiles.push(arr);
}
function fit() {
  const h = boardEl.clientHeight, w = boardEl.clientWidth, gap = 6;
  if (!h) return;
  const s = Math.floor(Math.min(58, (h - ROWS * gap) / ROWS, (w - 4 * gap) / COLS));
  boardEl.style.setProperty("--ts", Math.max(28, s) + "px");
}
let rz; window.addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(fit); });

function paintCurrent() {
  const r = guesses.length; if (r >= ROWS) return;
  for (let c = 0; c < COLS; c++) {
    const t = tiles[r][c], ch = current[c];
    if (ch) { t.textContent = ch; t.className = "tile filled"; }
    else if (hintLetters[c]) { t.textContent = hintLetters[c]; t.className = "tile ghost"; }
    else { t.textContent = ""; t.className = "tile"; }
  }
}
function evaluate(g) {
  const gs = [...g], ss = [...secret], res = Array(COLS).fill("gray"), left = {};
  for (let i = 0; i < COLS; i++) { if (gs[i] === ss[i]) res[i] = "green"; else left[ss[i]] = (left[ss[i]] || 0) + 1; }
  for (let i = 0; i < COLS; i++) { if (res[i] !== "green" && left[gs[i]] > 0) { res[i] = "yellow"; left[gs[i]]--; } }
  return res;
}
function press(k) {
  if (over || busy) return;
  if (k === "ENTER") return submit();
  if (k === "DEL") { current.pop(); sfx.del(); return paintCurrent(); }
  if (current.length < COLS) { current.push(k); sfx.tap(); buzz(8); paintCurrent(); }
}
document.addEventListener("keydown", e => {
  if ($("game").hidden || $("modal").classList.contains("show")) return;
  if (e.key === "Enter") press("ENTER");
  else if (e.key === "Backspace") press("DEL");
  else { const ch = e.key.replace("ي", "ی").replace("ك", "ک"); if (/^[\u0600-\u06FF]$/.test(ch)) press(ch); }
});

function submit() {
  const r = guesses.length;
  if (current.length < COLS) {
    const row = rowEls[r]; row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
    sfx.err(); buzz(40);
    return toast("کلمه باید ۵ حرفی باشه");
  }
  const word = current.join(""), res = evaluate(word), id = runId;
  guesses.push(word); current = []; busy = true;
  const lite = S.lite, step = lite ? 0 : 170;
  [...word].forEach((ch, c) => {
    const t = tiles[r][c];
    t.textContent = ch;
    if (lite) t.className = "tile " + res[c];
    else {
      t.className = "tile flip"; t.style.animationDelay = (c * step) + "ms";
      setTimeout(() => { if (id !== runId) return; t.className = "tile flip " + res[c]; sfx.flip(c); }, c * step + 250);
    }
  });
  setTimeout(() => {
    if (id !== runId) return;
    const rank = { gray: 1, yellow: 2, green: 3 };
    [...word].forEach((ch, c) => {
      const old = keyState[ch];
      if (!old || rank[res[c]] > rank[old]) { keyState[ch] = res[c]; keyEls[ch].className = "key " + res[c]; }
    });
    busy = false;
    if (word === secret) return finish(true);
    if (guesses.length >= ROWS) return finish(false);
    paintCurrent();
  }, lite ? 60 : (COLS - 1) * step + 560);
}

function finish(win) {
  over = true; S.play++;
  let stars = 0; const id = runId;
  if (win) {
    S.win++; S.streak++;
    const att = guesses.length;
    stars = att <= 2 ? 3 : att <= 4 ? 2 : 1;
    const first = !S.stars[curLevel];
    if (stars > (S.stars[curLevel] || 0)) S.stars[curLevel] = stars;
    if (curLevel === S.level && S.level < CONFIG.TOTAL_LEVELS) S.level++;
    lastReward = first ? (isBoss(curLevel) ? CONFIG.BOSS_REWARD : CONFIG.WIN_REWARD) : 0;
    if (lastReward) addCoins(lastReward);
    sfx.win(); buzz([30, 50, 30]); confetti();
  } else { S.streak = 0; sfx.lose(); buzz(120); }
  save(); updateHud();
  setTimeout(() => {
    if (id !== runId) return;
    if (win) {
      const hasNext = curLevel < CONFIG.TOTAL_LEVELS;
      const starsHtml = [0, 1, 2].map(i => `<span style="animation-delay:${i * .25}s">${i < stars ? "⭐" : "☆"}</span>`).join("");
      openModal(`
        <h2>🎉 آفرین!</h2>
        <div class="stars">${starsHtml}</div>
        <p>کلمه‌ی «${secret}» رو در ${fa(guesses.length)} تلاش پیدا کردی.<br>
        ${lastReward ? `<b style="color:#ffd54a">+${fa(lastReward)} سکه میثی 🪙</b>` : `<span style="opacity:.7">جایزه‌ی سکه فقط بار اوله</span>`}</p>
        <div class="btns">
          ${lastReward ? `<button class="primary gold" data-act="double">🎬 دو برابر کن (دیدن تبلیغ)</button>` : ""}
          ${hasNext ? `<button class="primary" data-act="nextlevel">مرحله‌ی بعد ◀</button>` : ""}
          <button class="ghostbtn" data-act="tolevels">بازگشت به مراحل</button>
        </div>`);
    } else {
      openModal(`
        <h2>😅 این دفعه نشد</h2>
        <p>کلمه‌ی درست: <b>${secret}</b></p>
        <div class="btns">
          ${revived ? "" : `<button class="primary gold" data-act="revive">🎬 یه فرصت دیگه (دیدن تبلیغ)</button>`}
          <button class="primary" data-act="retry">🔄 دوباره امتحان کن</button>
          <button class="ghostbtn" data-act="tolevels">بازگشت به مراحل</button>
        </div>`);
    }
  }, S.lite ? 150 : 900);
}

/* ===================== راهنماها ===================== */
$("hLetter").addEventListener("click", () => {
  if (over || busy) return;
  const known = new Set();
  guesses.forEach(g => evaluate(g).forEach((v, i) => { if (v === "green") known.add(i); }));
  const free = [0, 1, 2, 3, 4].filter(i => !known.has(i) && !hintLetters[i]);
  if (!free.length) return toast("همه‌ی حرف‌ها پیدا یا لو رفته!");
  if (!spend(CONFIG.COST.letter)) return;
  const i = free[Math.floor(Math.random() * free.length)];
  hintLetters[i] = [...secret][i]; paintCurrent(); sfx.coin();
  toast(`💡 حرف شماره ${fa(i + 1)} کلمه: «${hintLetters[i]}»`);
});
$("hClean").addEventListener("click", () => {
  if (over || busy) return;
  const cand = LETTERS.filter(ch => !secret.includes(ch) && !keyState[ch]);
  if (!cand.length) return toast("حرف اشتباه دیگه‌ای نمونده");
  if (!spend(CONFIG.COST.clean)) return;
  cand.sort(() => Math.random() - .5).slice(0, 5).forEach(ch => { keyState[ch] = "gray"; keyEls[ch].className = "key gray"; });
  sfx.coin(); toast("🧹 ۵ حرف اشتباه حذف شد");
});
function addRow() { ROWS++; createRow(); fit(); }
$("hRow").addEventListener("click", () => {
  if (over || busy) return;
  if (extraUsed) return toast("تلاش اضافه فقط یک بار در هر مرحله");
  if (!spend(CONFIG.COST.row)) return;
  extraUsed = true; addRow(); sfx.coin(); toast("➕ یک تلاش اضافه گرفتی");
});

/* جایزه‌ی روزانه */
function openDaily() {
  const can = claimable();
  let st = S.dayStreak; if (can && S.dayLast !== dayNum() - 1) st = 0;
  const idx = st % 7;
  const cells = CONFIG.DAILY.map((v, i) => `<div class="day${i === 6 ? " last" : ""}${i < idx ? " done" : ""}${can && i === idx ? " today" : ""}">روز ${fa(i + 1)}<b>${i < idx ? "✅" : "🪙 " + fa(v)}</b></div>`).join("");
  openModal(`
    <h2>🎁 جایزه‌ی روزانه</h2>
    <p>هر روز بیای جایزه‌ات بیشتر می‌شه! یه روز نیای، از اول شروع می‌شه.</p>
    <div class="days">${cells}</div>
    <div class="btns">
      ${can ? `<button class="primary gold" data-act="claimdaily">دریافت ${fa(CONFIG.DAILY[idx])} سکه 🪙</button>` : `<button class="primary" disabled>فردا دوباره بیا 🌙</button>`}
      <button class="ghostbtn" data-act="close">بستن</button>
    </div>`, "daily");
}
function claimDaily() {
  if (!claimable()) return;
  if (S.dayLast !== dayNum() - 1) S.dayStreak = 0;
  const v = CONFIG.DAILY[S.dayStreak % 7];
  S.dayStreak++; S.dayLast = dayNum(); save();
  addCoins(v); sfx.coin(); confetti(); closeModal(); toast(`🎁 ${fa(v)} سکه میثی گرفتی!`);
}

/* چرخ شانس */
let wheelRot = 0, spinning = false;
function wheelButtons() {
  return S.wheelDay !== dayNum()
    ? `<button class="primary gold" data-act="spin">🎡 بچرخون (رایگان)</button><button class="ghostbtn" data-act="close">بستن</button>`
    : `<button class="primary gold" data-act="spinad">🎬 یه چرخش دیگه (دیدن تبلیغ)</button><button class="ghostbtn" data-act="close">بستن</button>`;
}
function openWheel() {
  wheelRot = 0; spinning = false;
  const labs = CONFIG.WHEEL.map((s, i) => `<div class="lab" style="transform:rotate(${i * 60 + 30}deg) translateY(-80px)">${fa(s.v)}</div>`).join("");
  openModal(`
    <h2>🎡 چرخ شانس</h2>
    <div class="wheelwrap"><div class="ptr">▼</div><div class="wheel" id="wheel">${labs}</div><div class="hub"></div></div>
    <p id="wmsg">${S.wheelDay !== dayNum() ? "امروز یه چرخش رایگان داری!" : "چرخش رایگان امروزت تموم شده."}</p>
    <div class="btns" id="wbtns">${wheelButtons()}</div>`, "wheel");
}
function doSpin() {
  if (spinning) return; spinning = true;
  const W = CONFIG.WHEEL, tot = W.reduce((a, s) => a + s.w, 0);
  let r = Math.random() * tot, idx = 0;
  for (let i = 0; i < W.length; i++) { r -= W[i].w; if (r <= 0) { idx = i; break; } }
  const delta = ((-(idx * 60 + 30) - wheelRot) % 360 + 360) % 360;
  wheelRot += 360 * 5 + delta;
  const w = $("wheel"); w.style.transition = S.lite ? "none" : "transform 3.8s cubic-bezier(.17,.67,.12,1)";
  w.style.transform = "rotate(" + wheelRot + "deg)";
  const v = W[idx].v;
  setTimeout(() => {
    spinning = false; addCoins(v); sfx.coin(); confetti();
    toast(`🎉 ${fa(v)} سکه برنده شدی!`);
    if (modalName === "wheel") { $("wmsg").textContent = `🎉 ${fa(v)} سکه گرفتی!`; $("wbtns").innerHTML = wheelButtons(); }
  }, S.lite ? 200 : 4000);
}

/* آموزش */
const SLIDES = [
  { t: "🔤 طرز بازی", h: () => `
      <p>یه کلمه‌ی ۵ حرفی مخفی هست. در ۶ تلاش پیداش کن!</p>
      <div class="demo">${[["ب","green"],["ا","green"],["ز","gray"],["ا","green"],["ر","yellow"]].map(x => `<div class="tile ${x[1]}">${x[0]}</div>`).join("")}</div>
      <p>🟩 حرف درسته و جاش هم درسته<br>🟨 حرف تو کلمه هست ولی جاش اشتباهه<br>⬜ این حرف تو کلمه نیست</p>` },
  { t: "🗺️ جهان‌ها و مرحله‌ها", h: () => `
      <p>${fa(CONFIG.TOTAL_LEVELS)} مرحله توی جهان‌های رنگارنگ منتظرته!<br>
      با بردن هر مرحله، مرحله‌ی بعد باز می‌شه 🔓<br>
      هرچی زودتر پیدا کنی ستاره‌ی بیشتری می‌گیری ⭐⭐⭐<br>
      هر مرحله‌ی دهم، مرحله‌ی سخت 👑 با جایزه‌ی بیشتره!</p>` },
  { t: "🪙 سکه میثی", h: () => `
      <p>با سکه می‌تونی راهنما بگیری:</p>
      <p>💡 <b>افشای حرف</b> (${fa(CONFIG.COST.letter)} سکه)<br>
      🧹 <b>حذف ۵ حرف اشتباه</b> (${fa(CONFIG.COST.clean)} سکه)<br>
      ➕ <b>تلاش اضافه</b> (${fa(CONFIG.COST.row)} سکه)</p>` },
  { t: "🎁 سکه از کجا بیارم؟", h: () => `
      <p>✅ بردن هر مرحله: <b>${fa(CONFIG.WIN_REWARD)}</b> سکه<br>
      ✅ جایزه‌ی روزانه و چرخ شانس 🎡<br>
      ✅ دیدن تبلیغ: <b>${fa(CONFIG.AD_REWARD)}</b> سکه رایگان<br>
      ✅ یا از فروشگاه بخر</p>` }
];
function showTutorial(i) {
  const s = SLIDES[i], last = i === SLIDES.length - 1;
  openModal(`
    <h2>${s.t}</h2>${s.h()}
    <div class="dots">${SLIDES.map((_, k) => `<span class="dt ${k === i ? "on" : ""}"></span>`).join("")}</div>
    <div class="btns">
      ${last ? `<button class="primary gold" data-act="tdone">بزن بریم! 🎮</button>`
             : `<button class="primary" data-act="tnext" data-i="${i + 1}">بعدی</button><button class="ghostbtn" data-act="tdone">رد کردن</button>`}
    </div>`, "tutorial");
}

$("modal").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "tnext") showTutorial(+b.dataset.i);
  else if (a === "tdone") { S.seen = true; save(); closeModal(); if (claimable()) openDaily(); }
  else if (a === "close") closeModal();
  else if (a === "nextlevel") startLevel(curLevel + 1);
  else if (a === "retry") startLevel(curLevel);
  else if (a === "tolevels") { closeModal(); mapPage = worldOf(S.level); show("levels"); }
  else if (a === "ad") watchAd(() => { addCoins(CONFIG.AD_REWARD); sfx.coin(); toast(`🎬 +${fa(CONFIG.AD_REWARD)} سکه`); if (modalName === "shop") openShop(); });
  else if (a === "buy") { const p = CONFIG.PACKS.find(x => x.id === b.dataset.id); purchase(p, () => { addCoins(p.coins); sfx.coin(); openShop(); }); }
  else if (a === "double") watchAd(() => { addCoins(lastReward); sfx.coin(); b.disabled = true; b.textContent = "✅ دو برابر شد!"; });
  else if (a === "revive") watchAd(() => { runId++; revived = true; over = false; busy = false; addRow(); closeModal(); paintCurrent(); toast("➕ یه فرصت دیگه گرفتی!"); });
  else if (a === "claimdaily") claimDaily();
  else if (a === "spin") { S.wheelDay = dayNum(); save(); updateHud(); $("wbtns").innerHTML = ""; doSpin(); }
  else if (a === "spinad") watchAd(() => { $("wbtns").innerHTML = ""; doSpin(); });
});

/* ===================== دکمه‌های لابی ===================== */
$("helpBtn").addEventListener("click", () => showTutorial(0));
$("liteBtn").addEventListener("click", () => { S.lite = !S.lite; save(); applyPrefs(); toast(S.lite ? "⚡ حالت سبک روشن شد" : "✨ افکت‌ها روشن شد"); });
$("sndBtn").addEventListener("click", () => { S.sound = !S.sound; save(); applyPrefs(); if (S.sound) sfx.coin(); });
$("dailyBtn").addEventListener("click", () => { sfx.tap(); openDaily(); });
$("wheelBtn").addEventListener("click", () => { sfx.tap(); openWheel(); });

let tt;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1800); }

/* ===================== شروع ===================== */
$("cLetter").textContent = fa(CONFIG.COST.letter);
$("cClean").textContent = fa(CONFIG.COST.clean);
$("cRow").textContent = fa(CONFIG.COST.row);
applyPrefs(); buildKeyboard(); show("lobby");
if (!S.seen) showTutorial(0); else if (claimable()) openDaily();
</script>
</body>
